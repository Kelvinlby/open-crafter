[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencrafter"
version = "0.1.0"
description = "Backend client for the open-crafter Minecraft mod (control socket + shared-memory frames)"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
	"msgpack>=1.0",
	"numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["opencrafter*"]
