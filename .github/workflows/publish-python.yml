# Publishes the Python package (python/) to PyPI through a trusted publisher (OIDC, no token).
#
# Release: Actions > publish-python > Run workflow, enter the version (e.g. 0.2.0). The version is
# written into pyproject.toml for the build only; the published commit is tagged python-v<version>.
#
# PyPI trusted publisher settings: owner Kelvinlby, repository open-crafter,
# workflow publish-python.yml, environment pypi.

name: publish-python
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (PEP 440, e.g. 0.2.0 or 0.2.0rc1)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m pip install packaging
          python -c "import os, packaging.version as v; s = os.environ['VERSION']; assert str(v.Version(s)) == s, f'{s} is not a canonical PEP 440 version'"
          if git rev-parse -q --verify "refs/tags/python-v$VERSION" >/dev/null; then
            echo "::error::python-v$VERSION was already released"
            exit 1
          fi
      - name: build sdist and wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" python/pyproject.toml
          grep -q "^version = \"$VERSION\"" python/pyproject.toml
          cp LICENSE python/LICENSE  # ship the licence text; setuptools picks up LICENSE* by itself
          python -m pip install build twine
          python -m build python --outdir dist
          python -m twine check --strict dist/*
      - name: upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/opencrafter/${{ inputs.version }}/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist/
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: tag the published commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "python-v$VERSION"
          git push origin "python-v$VERSION"
